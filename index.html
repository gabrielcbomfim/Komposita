<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Play Komposita, a free Little Alchemy-style game for learning German compound words. Combine words to discover thousands of compounds and explore German word formation." />
    <title>Komposita – German Compound Word Game</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A9%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <main class="game-shell">

        <!-- 1. Action rail (left) -->
        <aside class="action-rail" aria-label="Actions">
            <div class="sidebar-brand">
                <div>
                    <p class="eyebrow">Deutsch lernen</p>
                    <h1>Komposita</h1>
                </div>
            </div>
            <nav class="action-list" aria-label="Actions">
                <button id="clean-up-table-button" class="action-button" type="button">
                    <img class="action-icon" src="assets/icons/clean-table.png" alt="Clean up table">
                    <span class="action-label">Clean up table</span>
                </button>
                <button id="clean-up-list-button" class="action-button" type="button">
                    <img class="action-icon" src="assets/icons/clean-list.png" alt="Clean up list">
                    <span class="action-label">Clean up list</span>
                </button>
                <button id="settings-button" class="action-button" type="button">
                    <img class="action-icon" src="assets/icons/settings.png" alt="Settings">
                    <span class="action-label">Settings</span>
                </button>
                <button id="dictionary-button" class="action-button" type="button">
                    <img class="action-icon" src="assets/icons/dictionary.png" alt="Dictionary">
                    <span class="action-label">Dictionary</span>
                </button>
            </nav>
        </aside>

        <!-- 2. Discovery area: search/add dock + tableau -->
        <section class="play-area" aria-label="Discovery area">
            <div class="search-dock" aria-label="Search">
                <div class="search-actions">
                    <button id="search-toggle" class="search-toggle" type="button" aria-label="Search names" aria-expanded="false" title="Search names">⌕</button>
                    <button id="search-close-button" class="search-close-button" type="button" aria-label="Close search" title="Close search" hidden>×</button>
                    <button id="add-word-button" class="add-word-button" type="button" aria-label="Add a word" title="Add a word">+</button>
                    <button id="add-close-button" class="add-close-button" type="button" aria-label="Close add word" title="Close add word" hidden>×</button>
                </div>

                <!-- Search Panel -->
                <div id="search-panel" class="search-panel" hidden>
                    <div class="search-field">
                        <button id="category-toggle" class="category-toggle" type="button" aria-label="Filter by class" aria-expanded="false" title="Filter by class">☰</button>
                        <input id="element-search" type="search" placeholder="Search words" />
                    </div>
                    <label id="category-field" class="category-field" for="category-filter" hidden>
                        <span>Class</span>
                        <select id="category-filter">
                            <option value="all">All classes</option>
                            <option value="noun">Nouns</option>
                            <option value="verb">Verbs</option>
                            <option value="adverb">Adverbs</option>
                            <option value="preposition">Prepositions</option>
                            <option value="adjective">Adjectives</option>
                            <option value="pronoun">Pronouns</option>
                        </select>
                    </label>
                </div>

                <!-- Add Word Panel -->
                <div id="add-panel" class="add-panel" hidden>
                    <div class="search-field">
                        <button id="add-category-toggle" class="category-toggle" type="button" aria-label="Filter by class" aria-expanded="false" title="Filter by class">☰</button>
                        <input id="add-word-search" type="search" placeholder="Add a word" autocomplete="off" />
                    </div>
                    <label id="add-category-field" class="category-field" for="add-category-filter" hidden>
                        <span>Class</span>
                        <select id="add-category-filter">
                            <option value="all">All classes</option>
                            <option value="noun">Nouns</option>
                            <option value="verb">Verbs</option>
                            <option value="adverb">Adverbs</option>
                            <option value="preposition">Prepositions</option>
                            <option value="adjective">Adjectives</option>
                            <option value="pronoun">Pronouns</option>
                        </select>
                    </label>
                    <div id="add-suggestions" class="add-suggestions" role="listbox" aria-label="Word suggestions"></div>
                </div>
            </div>

            <!-- Tableau where words are placed and linked -->
            <div id="workspace" class="workspace" aria-live="polite"></div>
        </section>

        <!-- 3. Word list (right) -->
        <aside class="element-panel" aria-label="Words">
            <div id="element-list" class="element-list"></div>
        </aside>
    </main>

    <p id="result-text" class="sr-only" role="status" aria-live="polite">Ready.</p>

    <!-- Plain scripts, loaded in dependency order (no bundler needed) -->
    <script src="js/dictionary.js"></script>
    <script src="js/emoji-service.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/workspace.js"></script>
    <script src="js/crafting.js"></script>
    <script src="js/word-list.js"></script>
    <script src="js/search-panel.js"></script>
    <script src="js/add-word-panel.js"></script>
    <script src="js/action-button.js"></script>
    <script src="js/clean-up-table-button.js"></script>
    <script src="js/clean-up-list-button.js"></script>
    <script src="js/settings-button.js"></script>
    <script src="js/dictionary-button.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
